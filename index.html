<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Meta tags padrão (Portal do Cliente) -->
    <title>Portal do Cliente · Destra</title>
    <meta name="description" content="Portal do Cliente Destra — acompanhe seus projetos, aprovações e entregas em tempo real." />

    <!-- OG padrão (Portal do Cliente) -->
    <meta property="og:title" content="Portal do Cliente · Destra" />
    <meta property="og:description" content="Acompanhe projetos, aprovações e entregas em tempo real." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Destra" />

    <!-- Twitter Card padrão -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Portal do Cliente · Destra" />
    <meta name="twitter:description" content="Acompanhe projetos, aprovações e entregas em tempo real." />

    <!-- Script que ajusta as meta tags conforme a rota acessada -->
    <script>
      (function () {
        var path = window.location.pathname.toLowerCase();
        var isInternal = path === '/autenticar' || path === '/';

        if (isInternal) {
          document.title = 'Central Destra · Acesso da Equipe';

          function setMeta(sel, attr, val) {
            var el = document.querySelector(sel);
            if (el) el.setAttribute(attr, val);
          }

          setMeta('meta[name="description"]', 'content', 'Plataforma interna da equipe Destra. Gerencie projetos, clientes, finanças e muito mais.');
          setMeta('meta[property="og:title"]', 'content', 'Central Destra · Acesso da Equipe');
          setMeta('meta[property="og:description"]', 'content', 'Plataforma interna da equipe Destra. Gestão de projetos, CRM, finanças e relatórios.');
          setMeta('meta[name="twitter:title"]', 'content', 'Central Destra · Acesso da Equipe');
          setMeta('meta[name="twitter:description"]', 'content', 'Plataforma interna da equipe Destra. Gestão de projetos, CRM, finanças e relatórios.');
        }
      })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portal Destra" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://media.base44.com/images/public/68f8158f5a9adbc29cfb7e53/236087060_Simboloazulclaro13.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
